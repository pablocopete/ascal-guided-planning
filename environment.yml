name: ascal_env
channels:
  - defaults
dependencies:
  - python=3.10.19
  - pip
  - pip:
    # Core runtime
    - numpy>=1.24
    - matplotlib>=3.7
    - unified-planning>=1.3.0
    - up-fast-downward==0.2.3
    - ConfigSpace>=1.0
    - more-itertools
    - networkx
    - scipy
    # Notebook support (optional, needed to re-run notebooks/)
    - jupyter
    - ipykernel
    - nbconvert
    # ASCAL 
    - ascal